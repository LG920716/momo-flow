id: template_chat_flow
name: Template Chat Flow
environment:
  python_requirements_txt: requirements.txt
inputs:
  tokens_per_message:
    type: int
    default: 2
  tokens_per_name:
    type: int
    default: 1
  chat_history:
    type: list
    default: []
  img_url:
    type: string
    default: https://og.momoshop.com.tw/goodsimg/0011/607/335/11607335_B.jpg
outputs:
  answer:
    type: string
    reference: ${image.output}
nodes:
- name: image
  type: custom_llm
  source:
    type: package_with_prompt
    tool: promptflow.tools.llm.llm
    path: image.jinja2
  inputs:
    connection: momo
    api: chat
    temperature: 0
    image_input: ${preprocess_image.output}
    deployment_name: gpt-4o-2
    max_tokens: 4096
- name: preprocess_image
  type: python
  source:
    type: code
    path: preprocess_image.py
  inputs:
    url: ${inputs.img_url}
